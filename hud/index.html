<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia HUD - 实时状态监控</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        .card h2 {
            font-size: 14px;
            color: #888;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .status-idle {
            background: #2a2a2a;
            color: #888;
        }
        .status-active {
            background: #0ea5e920;
            color: #0ea5e9;
        }
        .status-thinking {
            background: #f59e0b20;
            color: #f59e0b;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-label {
            color: #888;
            font-size: 14px;
        }
        .metric-value {
            font-size: 16px;
            font-weight: 600;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progress-green { background: #10b981; }
        .progress-yellow { background: #f59e0b; }
        .progress-red { background: #ef4444; }
        .tool-call {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #2a2a2a;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .tool-icon {
            font-size: 16px;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        .task-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .task-done { background: #10b981; }
        .task-pending { background: #2a2a2a; border: 2px solid #666; }
        .task-current { background: #0ea5e9; animation: pulse 1s infinite; }
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .connected { background: #10b98120; color: #10b981; }
        .disconnected { background: #ef444420; color: #ef4444; }
    </style>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">
        ⚠️ 未连接
    </div>
    
    <div class="container">
        <h1>🧠 Dia HUD</h1>
        <p class="subtitle">OpenClaw Agent 实时状态监控</p>
        
        <div class="grid">
            <!-- Agent Status -->
            <div class="card">
                <h2>Agent 状态</h2>
                <div class="status-badge status-idle" id="statusBadge">
                    <span class="pulse-dot"></span>
                    <span id="statusText">空闲中</span>
                </div>
                <div class="metric">
                    <span class="metric-label">当前任务</span>
                    <span class="metric-value" id="currentTask">无</span>
                </div>
                <div class="metric">
                    <span class="metric-label">模型</span>
                    <span class="metric-value" id="model">zai/glm-5</span>
                </div>
            </div>
            
            <!-- Context Usage -->
            <div class="card">
                <h2>Context 使用率</h2>
                <div class="metric">
                    <span class="metric-label">已用 Token</span>
                    <span class="metric-value" id="tokensUsed">0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill progress-green" id="contextBar" style="width: 0%"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #888;">
                    <span>0</span>
                    <span id="maxTokens">128,000</span>
                </div>
            </div>
            
            <!-- Session Info -->
            <div class="card">
                <h2>会话信息</h2>
                <div class="metric">
                    <span class="metric-label">运行时长</span>
                    <span class="metric-value" id="duration">0:00</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Gateway PID</span>
                    <span class="metric-value" id="gatewayPid">-</span>
                </div>
                <div class="metric">
                    <span class="metric-label">CPU使用率</span>
                    <span class="metric-value" id="cpuPercent">0%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">内存占用</span>
                    <span class="metric-value" id="memoryMb">0 MB</span>
                </div>
            </div>
            
            <!-- Tool Calls -->
            <div class="card">
                <h2>工具调用</h2>
                <div class="metric">
                    <span class="metric-label">今日调用</span>
                    <span class="metric-value" id="toolCallsToday">0</span>
                </div>
                <div id="recentTools">
                    <div class="tool-call">
                        <span class="tool-icon">📊</span>
                        <span>等待数据...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tasks -->
        <div class="card">
            <h2>活跃会话</h2>
            <div id="taskList">
                <div class="task-item">
                    <div class="task-status task-pending"></div>
                    <span>暂无活跃任务</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws;
        let statusData = {};
        
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsPort = parseInt(window.location.port) + 1;
            ws = new WebSocket(`${protocol}//${window.location.hostname}:${wsPort}`);
            
            ws.onopen = () => {
                document.getElementById('connectionStatus').className = 'connection-status connected';
                document.getElementById('connectionStatus').textContent = '✓ 已连接';
            };
            
            ws.onclose = () => {
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
                document.getElementById('connectionStatus').textContent = '⚠️ 未连接';
                setTimeout(connect, 3000);
            };
            
            ws.onmessage = (event) => {
                statusData = JSON.parse(event.data);
                updateUI();
            };
        }
        
        function updateUI() {
            // Agent Status
            const status = statusData.agent?.status || 'idle';
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            
            statusBadge.className = `status-badge status-${status}`;
            statusText.textContent = status === 'idle' ? '空闲中' : 
                                     status === 'active' ? '工作中' : 
                                     status === 'thinking' ? '思考中' : status;
            
            document.getElementById('currentTask').textContent = statusData.agent?.current_task || '无';
            document.getElementById('model').textContent = statusData.agent?.model || 'zai/glm-5';
            
            // Context
            const tokens = statusData.context?.used_tokens || 0;
            const maxTokens = statusData.context?.max_tokens || 128000;
            const percent = (tokens / maxTokens * 100).toFixed(1);
            
            document.getElementById('tokensUsed').textContent = tokens.toLocaleString();
            document.getElementById('contextBar').style.width = `${percent}%`;
            
            const bar = document.getElementById('contextBar');
            bar.className = `progress-fill ${percent < 70 ? 'progress-green' : percent < 85 ? 'progress-yellow' : 'progress-red'}`;
            
            // Session
            document.getElementById('duration').textContent = statusData.session?.duration || statusData.session?.uptime || '0:00';
            document.getElementById('gatewayPid').textContent = statusData.session?.gateway_pid || '-';
            document.getElementById('cpuPercent').textContent = `${statusData.session?.cpu_percent || 0}%`;
            document.getElementById('memoryMb').textContent = `${(statusData.session?.memory_mb || 0).toFixed(1)} MB`;
            
            // Tools
            document.getElementById('toolCallsToday').textContent = statusData.tools?.calls_today || 0;
            
            const recentTools = document.getElementById('recentTools');
            if (statusData.tools?.recent_calls?.length > 0) {
                recentTools.innerHTML = statusData.tools.recent_calls.slice(0, 5).map(tool => `
                    <div class="tool-call">
                        <span class="tool-icon">${tool.icon || '🔧'}</span>
                        <span>${tool.name}</span>
                    </div>
                `).join('');
            }
        }
        
        connect();
    </script>
</body>
</html>
